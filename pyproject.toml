[project]
name = "05-kk-golden-throat"
version = "0.1.0"
description = "One object instead of a choice of vacuum to put the observer in de Sitter space"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mpmath>=1.3.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/src"]
addopts = "--tb=short -p no:cacheprovider"
markers = [
    "slow: marks tests that take >10 s (deselect with '-m \"not slow\"')",
    "figure: tests that render one of the five figures cited by main.tex",
    "section: contract test of the suite's structure (references, figures, no-import)",
]
